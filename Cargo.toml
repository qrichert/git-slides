[package]
name = "git-slides"
version = "0.5.1"
edition = "2024"
authors = ["Quentin Richert <noreply@richert.co>"]
description = "Navigate through Git commits like presentation slides."
license = "GPL-3.0-or-later"
repository = "https://github.com/qrichert/git-slides.git"
readme = "README.md"
keywords = ["git", "presentation", "slides", "slideshow", "training"]
categories = ["command-line-utilities", "development-tools"]

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[dependencies]
# Output text through a pager.
lessify = "0.4.0"
